<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161a24"/>
      <stop offset="50%" stop-color="#0c0e12"/>
      <stop offset="100%" stop-color="#07080b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <!-- Outer Gold Ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-opacity="0.7"/>
  <!-- Inner Subtle Circle -->
  <circle cx="256" cy="240" r="150" fill="#f59e0b" fill-opacity="0.08" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>
  <!-- Lightning Bolt Icon -->
  <path d="M285 95 L155 265 H250 L225 405 L360 225 H262 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <!-- Label SANTA CHELA -->
  <text x="256" y="458" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#fbbf24" text-anchor="middle" letter-spacing="4">SANTA CHELA</text>
</svg>
